name: Deploy NAS
on:
  push:
    branches: [main]

jobs:
  terraform:
    runs-on: ubuntu-latest
    steps:
      - name: Terraform Apply
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.DESKTOP_IP }}
          port: 2222
          username: ${{ secrets.DESKTOP_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ~/School/2026winter/tailscale/terraform
            TF_VAR_virtual_environment_endpoint="${{ secrets.TF_ENDPOINT }}" \
            TF_VAR_virtual_environment_password="${{ secrets.TF_PASSWORD }}" \
            terraform apply -auto-approve

  provision:
    needs: terraform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Ansible
        run: pip install ansible
      - name: Setup SSH Keys
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p 2222 ${{ secrets.DESKTOP_IP }} >> ~/.ssh/known_hosts
      - name: Run Ansible
        run: ansible-playbook -i ansible/inventory.ini ansible/playbook.yml
        env:
          SSH_PUBLIC_KEY: ${{ secrets.SSH_PUBLIC_KEY }}
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
          SAMBA_USER_PASSWORD: ${{ secrets.SAMBA_USER_PASSWORD }}
